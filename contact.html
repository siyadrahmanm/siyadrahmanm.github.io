
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
  </nav>

  <section>
    <h2>Contact</h2>

    <p>
      <i class="fas fa-user"></i>
      <strong>Name:</strong> Your Full Name
    </p>

    <p>
      <i class="fas fa-envelope"></i>
      <strong>Email:</strong>
      <a href="mailto:your.email@university.edu">
        your.email@university.edu
      </a>
    </p>

    <p>
      <i class="fas fa-university"></i>
      <strong>Department:</strong>
      Department of Mathematics
    </p>

    <p>
      <i class="fas fa-building"></i>
      <strong>Institution:</strong>
      University Name
    </p>

    <p>
      <i class="fas fa-map-marker-alt"></i>
      <strong>Address:</strong>
      University Address, City, Country
    </p>

    <h3>Academic Profiles</h3>

    <p>
      <i class="fas fa-graduation-cap"></i>
      <a href="YOUR_GOOGLE_SCHOLAR_URL">Google Scholar</a>
    </p>

    <p>
      <i class="fab fa-orcid"></i>
      <a href="YOUR_ORCID_URL">ORCID</a>
    </p>

    <p>
      <i class="fab fa-github"></i>
      <a href="YOUR_GITHUB_URL">GitHub</a>
    </p>

    <p>
      <i class="fab fa-linkedin"></i>
      <a href="YOUR_LINKEDIN_URL">LinkedIn</a>
    </p>

  </section>

</body>
</html>
